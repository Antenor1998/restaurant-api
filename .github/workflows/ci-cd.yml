name: CI/CD Pipeline

on:
  push:
    branches:
      - develop  # Cambiado a 'develop'
  pull_request:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:management
        ports:
          - 5672:5672
          - 15672:15672

      consul:
        image: hashicorp/consul:1.20.1
        ports:
          - 8500:8500

    steps:
    # 1. Check out the code from the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 3. Restore dependencies for TenantService
    - name: Restore dependencies for TenantService
      run: dotnet restore src/Services/TenantService/TenantService.API/TenantService.API.csproj

    # 4. Restore dependencies for AnalyticsService
    - name: Restore dependencies for AnalyticsService
      run: dotnet restore src/Services/AnalyticsService/AnalyticsService.API/AnalyticsService.API.csproj

    # 5. Build TenantService
    - name: Build TenantService
      run: dotnet build src/Services/TenantService/TenantService.API/TenantService.API.csproj --no-restore

    # 6. Build AnalyticsService
    - name: Build AnalyticsService
      run: dotnet build src/Services/AnalyticsService/AnalyticsService.API/AnalyticsService.API.csproj --no-restore

    # 7. Run tests for TenantService (opcional)
    - name: Run tests for TenantService
      run: dotnet test src/Services/TenantService/TenantService.API/TenantService.API.csproj

    # 8. Run tests for AnalyticsService (opcional)
    - name: Run tests for AnalyticsService
      run: dotnet test src/Services/AnalyticsService/AnalyticsService.API/AnalyticsService.API.csproj

    # 9. Build Docker images for both services
    - name: Build TenantService Docker image
      run: docker build -t tenant-service src/Services/TenantService/TenantService.API

    - name: Build AnalyticsService Docker image
      run: docker build -t analytics-service src/Services/AnalyticsService/AnalyticsService.API

    # 10. Push Docker images to Docker Hub (opcional)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push TenantService Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/tenant-service:latest

    - name: Push AnalyticsService Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest

    # 11. Deploy services using docker-compose
    - name: Deploy with docker-compose
      run: docker-compose up -d --build
