name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:management
        ports:
          - 5672:5672
          - 15672:15672

      consul:
        image: hashicorp/consul:1.20.1
        ports:
          - 8500:8500

    steps:
    # 1. Check out the code from the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 3. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore src/Services/**/**/*.csproj

    # 4. Build the projects
    - name: Build projects
      run: dotnet build src/Services/**/**/*.csproj --no-restore

    # 5. Run tests (opcional)
    - name: Run tests
      run: dotnet test src/Services/**/**/*.csproj

    # 6. Build Docker images
    - name: Build AnalyticsService Docker image
      run: docker build -t analytics-service src/Services/AnalyticsService/AnalyticsService.API

    - name: Build TenantService Docker image
      run: docker build -t tenant-service src/Services/TenantService/TenantService.API

    # 7. Push Docker images to Docker Hub (opcional)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push AnalyticsService Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest

    - name: Push TenantService Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/tenant-service:latest

    # 8. Deploy services using docker-compose
    - name: Deploy with docker-compose
      run: docker-compose up -d --build
