name: Build and Deploy TenantService

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.5
        options: --privileged

    steps:
    # Configurar checkout del repositorio
    - name: Checkout source code
      uses: actions/checkout@v3

    # Configurar .NET Core SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # Restaurar dependencias de NuGet
    - name: Restore dependencies
      run: dotnet restore src/Services/TenantService/TenantService.API/TenantService.API.csproj

    # Compilar el proyecto
    - name: Build project
      run: dotnet build -c Release src/Services/TenantService/TenantService.API/TenantService.API.csproj --no-restore

    # Publicar el proyecto auto-contenido
    - name: Publish project
      run: dotnet publish -c Release -r linux-x64 --self-contained -p:PublishTrimmed=true -o /app/publish --no-restore src/Services/TenantService/TenantService.API/TenantService.API.csproj

    # Crear la imagen Docker
    - name: Build Docker image
      run: |
        docker build -t myorg/tenant-service:latest .

    # Subir la imagen a Docker Hub o a tu registry
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      run: docker push myorg/tenant-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to Server
      run: |
        ssh -o StrictHostKeyChecking=no user@your-server "docker pull myorg/tenant-service:latest && docker-compose up -d"
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
