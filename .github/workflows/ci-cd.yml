name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:management
        ports:
          - 5672:5672
          - 15672:15672

      consul:
        image: hashicorp/consul:1.20.1
        ports:
          - 8500:8500

    steps:
    # 1. Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Set up .NET SDK
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # 3. Restore dependencies for TenantService
    - name: Restore dependencies for TenantService
      working-directory: src/Services/TenantService/TenantService.API
      run: dotnet restore

    # 4. Restore dependencies for AnalyticsService
    - name: Restore dependencies for AnalyticsService
      working-directory: src/Services/AnalyticsService/AnalyticsService.API
      run: dotnet restore

    # 5. Build TenantService Docker image
    - name: Build TenantService Docker image
      run: docker build -t tenant-service -f src/Services/TenantService/TenantService.API/Dockerfile .

    # 6. Build AnalyticsService Docker image
    - name: Build AnalyticsService Docker image
      run: docker build -t analytics-service -f src/Services/AnalyticsService/AnalyticsService.API/Dockerfile .

    # 7. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 8. Push Docker images to Docker Hub
    - name: Push TenantService Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/tenant-service:latest

    - name: Push AnalyticsService Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest

    # 9. Deploy with docker-compose
    - name: Deploy with docker-compose
      run: docker-compose up -d --build
